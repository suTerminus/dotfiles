    tags: []
    note: this repo (the public dotfiles)
  - url: github.com/suTerminus/ghost-bazaar
    path: code/personal/ghost-bazaar
    tags: []
    note: private Claude plugin marketplace (daedalus, forge, black-mirror)
  - url: github.com/suTerminus/daedalus
    path: code/personal/daedalus
    tags: []
    note: architecture & planning tooling; Claude plugin in ghost-bazaar marketplace
  - url: github.com/suTerminus/forge
    path: code/personal/forge
    tags: []
    note: development flow tooling; Claude plugin in ghost-bazaar marketplace
  - url: github.com/suTerminus/black-mirror
    path: code/personal/black-mirror
    tags: []
    note: personal work observability system; pulls activity data from all channels
  # ---------- Work [work] ----------
  - url: github.com/enersis/claude-marketplace
    path: code/work/enersis/claude-marketplace
    tags: [work]
    note: Enersis internal Claude plugin marketplace; registered via P2-40
  - url: github.com/enersis/resource-stores
    path: code/work/enersis/resource-stores
