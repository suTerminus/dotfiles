# Git repositories to clone during bootstrap (public scope).
#
# Scope of this file:
#   - The dotfiles repo itself (self-reference, for inventory completeness).
#   - Third-party public repos worth cloning on every machine
#     (e.g. reference codebases, vendored tooling).
#
# Personal `suTerminus/*` repos live in the personal overlay
# (`~/.local/share/chezmoi-private/inventory/repos-personal.yaml`).
# Enersis / work-org repos live in the work overlay
# (`~/.local/share/chezmoi-enersis/inventory/repos-enersis.yaml`).
# See inventory/README.md §"Three-repo partition".
#
# Schema:
#   url: git+ssh URL or github.com/owner/repo
#   path: where to clone, relative to $HOME
#   tags: visibility/scope (see inventory/README.md)

repos:
  - url: github.com/suTerminus/dotfiles
    path: code/personal/dotfiles
    tags: []
    note: this repo (the public dotfiles)

  # ---------- Third-party reference repos ----------
  # Add public OSS repos you want available on every machine here.
  # Example:
  # - url: github.com/kubernetes-sigs/kubebuilder
  #   path: code/third-party/kubebuilder
  #   tags: []
  #   note: kubebuilder source, for reference
