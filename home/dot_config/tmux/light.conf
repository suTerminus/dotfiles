# Catppuccin Latte for tmux — sourced by ~/.tmux.conf when ~/.theme-mode is `light`.

set -g status-style "bg=#eff1f5,fg=#4c4f69"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=#eff1f5,bg=#8839ef,bold] #S #[fg=#8839ef,bg=#eff1f5]"
set -g status-right "#[fg=#40a02b,bg=#eff1f5]#[fg=#eff1f5,bg=#40a02b] #h "

setw -g window-status-format         "#[fg=#9ca0b0,bg=#eff1f5] #I #[fg=#9ca0b0]#W "
setw -g window-status-current-format "#[fg=#eff1f5,bg=#fe640b] #I #[fg=#eff1f5,bold]#W #[fg=#fe640b,bg=#eff1f5]"

set -g pane-border-style       "fg=#bcc0cc"
set -g pane-active-border-style "fg=#8839ef"

set -g message-style "bg=#8839ef,fg=#eff1f5"
set -g mode-style    "bg=#8839ef,fg=#eff1f5"

set -g @theme_mode "light"
