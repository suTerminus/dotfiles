# Catppuccin Mocha for tmux — sourced by ~/.tmux.conf when ~/.theme-mode is `dark`.
# Status bar styling.

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#1e1e2e]"
set -g status-right "#[fg=#a6e3a1,bg=#1e1e2e]#[fg=#1e1e2e,bg=#a6e3a1] #h "

setw -g window-status-format         "#[fg=#7f849c,bg=#1e1e2e] #I #[fg=#7f849c]#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#fab387] #I #[fg=#1e1e2e,bold]#W #[fg=#fab387,bg=#1e1e2e]"

set -g pane-border-style       "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"

set -g message-style "bg=#cba6f7,fg=#1e1e2e"
set -g mode-style    "bg=#cba6f7,fg=#1e1e2e"

set -g @theme_mode "dark"
